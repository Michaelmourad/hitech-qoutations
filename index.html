<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HiTech Quotes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>HiTech Quotations</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app; editor / quote preview / archive behind a bottom tab bar.
   The quote itself is a fixed A4 sheet (210 x 297 mm) in the brand's orange + blue. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --ink:#1c2530; --muted:#667080; --line:#e3e6ea; --field:#f7f8fa; --soft:#eef1f5;
  --gold:#e8830f; --gold-soft:#eef1f5; --navy:#0b4a9e; --on-navy:#ffffff;
  --danger:#b3412e; --danger-soft:#fbe9e5; --ok:#2e7d55;
  --f-display:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Cairo",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --surface:#182029; --ink:#e8ebef; --muted:#97a1ad; --line:#2a3441; --field:#121920; --soft:#1f2833;
  --gold:#f5a04a; --gold-soft:#1f2833; --navy:#2e64b0; --on-navy:#ffffff;
  --danger:#e57a64; --danger-soft:#3a201b; --ok:#5cc08b; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin-inline:auto}
header.top{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
header.top img{width:66px;height:44px;object-fit:contain}
header.top h1{font-family:var(--f-display);font-size:19px;font-weight:800;margin:0;line-height:1.2}
header.top p{margin:0;color:var(--muted);font-size:12.5px}
@media (max-width:440px){header.top p{display:none}header.top h1{font-size:16px}}
header.top h1{white-space:nowrap}
.gear{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.gear svg{width:20px;height:20px}
.gear[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.langsw{margin-inline-start:auto;display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
.langsw button{background:transparent;border:0;padding:7px 11px;font-weight:700;font-size:13px;color:var(--muted)}
.langsw button[aria-pressed="true"]{background:var(--gold);color:#fff}
section.view{display:flex;flex-direction:column;gap:14px;padding-block:6px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
input,textarea,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical;min-height:62px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--navy);outline-offset:0;border-color:transparent}
input[inputmode="decimal"]{direction:ltr;font-variant-numeric:tabular-nums}
[dir="rtl"] input[inputmode="decimal"]{text-align:right}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:var(--field);border:0;padding:10px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#fff}
.pchip{margin-inline-start:auto;background:var(--gold-soft);border:1px solid var(--line);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.pchip small{font-size:10.5px;color:var(--muted)}
.pchip b{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums;direction:ltr}
.pos{color:var(--ok)}.neg{color:var(--danger)}
.ptot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptot .big{grid-column:1/-1;background:var(--navy);color:var(--on-navy);border-radius:var(--r);padding:16px}
.ptot .big span{font-size:13px;opacity:.85}
.ptot .big strong{display:block;font-family:var(--f-display);font-size:32px;font-weight:800;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
[dir="rtl"] .ptot .big strong{text-align:right}
.ptot .sm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.ptot .sm span{font-size:12px;color:var(--muted);display:block}
.ptot .sm strong{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;unicode-bidi:isolate;display:block}
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.month h3{margin:0;padding:12px 14px;font-family:var(--f-display);font-size:16px;display:flex;align-items:center;gap:8px;background:var(--soft)}
.month h3 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.month h3 b{margin-inline-start:auto;font-variant-numeric:tabular-nums;direction:ltr}
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px 14px;text-align:start;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.msum b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.inv{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.inv:last-child{border-bottom:0}
.inv .r1{display:flex;gap:8px;align-items:center}
.inv .r1 .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.inv .r1 b{margin-inline-start:auto;font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.inv .r2{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.inv .warn2{font-size:11.5px;color:var(--danger)}
.cmp{margin-top:8px;overflow-x:auto}
.cmp table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.cmp th{color:var(--muted);font-weight:600}
.cmp td.d{text-align:start;white-space:normal;min-width:110px}
.sw{margin-inline-start:auto;display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;font-size:12.5px;font-weight:600;color:var(--muted);font-family:var(--f-body)}
.sw i{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .15s;flex-shrink:0}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25);transition:inset-inline-start .15s}
.sw[aria-checked="true"]{color:var(--ok)}
.sw[aria-checked="true"] i{background:var(--ok)}
.sw[aria-checked="true"] i::after{inset-inline-start:21px}
.sw:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.notes.off{opacity:.5}
.ntog{background:none;border:0;padding:4px 0;display:inline-flex;align-items:center;gap:8px;font:inherit;font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink)}
.ntog .chev{display:inline-block;transition:transform .15s;color:var(--gold)}
[dir="rtl"] .ntog .chev{transform:scaleX(-1)}
.ntog[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sigpad{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.sigprev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:center}
.sigprev img{max-height:90px;max-width:100%}
.paper .ft .c2 .sig{display:block;height:52px;max-width:190px;object-fit:contain;margin-inline-start:auto;margin-top:2px}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:28px 1fr;gap:8px 10px;background:var(--surface)}
.item.bad{border-color:var(--danger);background:var(--danger-soft)}
.item .n{font-family:var(--f-display);font-weight:700;color:var(--muted);text-align:center;padding-top:8px}
.item .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.item .row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.item .lt{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:10px 4px;white-space:nowrap;direction:ltr;min-width:84px;text-align:end}
.item .bh{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .msg{font-size:12px;color:var(--danger)}
.x{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 2px;cursor:pointer;justify-self:start}
.x:hover{color:var(--danger)}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 14px;font-weight:600;font-size:14.5px;border:1px solid transparent;min-height:44px;text-align:center}
.btn:focus-visible,.tab:focus-visible,.x:focus-visible,.seg button:focus-visible,.langsw button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.gold{background:var(--navy);color:var(--on-navy)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.pact{background:var(--navy);color:var(--on-navy);border-color:var(--navy);transition:opacity .12s}
.btn.pact:active,.btn.pact:disabled{opacity:.75}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.add{border:1.5px dashed var(--line);background:transparent;color:var(--navy);font-weight:700}
.totalbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.totalbar .t{display:flex;flex-direction:column}
.totalbar .t span{font-size:12px;color:var(--muted)}
.totalbar .t strong{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.totalbar .acts{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.warn{font-size:13px;color:var(--danger)}
.editing{font-size:12.5px;background:var(--soft);border-inline-start:3px solid var(--navy);color:var(--ink);border-radius:9px;padding:8px 11px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.editing button{background:none;border:0;color:var(--navy);font-weight:700;padding:0}
.notes{display:flex;flex-direction:column;gap:8px}
.note{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.pvwrap{background:#dfe3e8;border-radius:var(--r);padding:10px;overflow:hidden;position:relative}
.pvscale{width:210mm;position:absolute;top:10px}
[dir="rtl"] .pvscale{right:10px;transform-origin:top right}
[dir="ltr"] .pvscale{left:10px;transform-origin:top left}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exp .btn{width:100%}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer;color:var(--ink);width:100%}
.q:hover{border-color:var(--gold)}
.q .nm{font-family:var(--f-display);font-weight:700;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.q .am{font-variant-numeric:tabular-nums;font-weight:700;direction:ltr;white-space:nowrap}
.q .meta{font-size:12px;color:var(--muted)}
.q .tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:6px;color:var(--muted)}
.q .acts{grid-column:1/-1;display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.q .acts .btn{min-height:36px;padding:6px 12px;font-size:13px}
.client{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chd{width:100%;background:none;border:0;padding:13px 14px;display:flex;align-items:center;gap:10px;font:inherit;color:var(--ink);text-align:start;cursor:pointer}
.chd .nm{font-family:var(--f-display);font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
.chd .cnt{font-size:12px;color:var(--muted)}
.chd b{margin-inline-start:auto;font-variant-numeric:tabular-nums;direction:ltr}
.chd[aria-expanded="true"]{background:var(--soft)}
.csum{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.csum b{display:block;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.crow{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.crow:last-child{border-bottom:0}
.crow .r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crow .kind{font-weight:700;font-size:13.5px}
.crow.deal .kind{color:var(--ok)}.crow.sale .kind{color:var(--navy)}.crow.buy .kind{color:var(--danger)}
.crow .dt{font-size:12px;color:var(--muted)}
.crow .amt{margin-inline-start:auto;font-variant-numeric:tabular-nums;direction:ltr}
.crow .r2{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.crow .r2 b{color:var(--ink);font-variant-numeric:tabular-nums}
.crow .acts{display:flex;gap:6px;flex-wrap:wrap}
.crow .acts .btn{min-height:36px;padding:6px 12px;font-size:13px}
.crow .buyb{color:var(--danger)}
.duetag{font-size:11.5px;color:var(--danger);border:1px solid var(--danger);border-radius:6px;padding:0 6px;white-space:nowrap}
.paidtag{font-size:11.5px;color:var(--ok);border:1px solid var(--ok);border-radius:6px;padding:0 6px}
.paybox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pline{display:flex;gap:10px;align-items:center;font-size:13px}.pline b{margin-inline-start:auto;font-variant-numeric:tabular-nums}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.lbox img{height:70px;object-fit:contain;align-self:center}
.lbox h2{margin:0;text-align:center;font-family:var(--f-display);font-size:18px}
.alert{display:inline-flex;align-items:center;gap:4px;background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.act{color:var(--navy);font-weight:700;font-size:12.5px;text-decoration:underline}
.dueCard{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dueCard .dhd{display:flex;align-items:center;gap:10px;padding:12px 14px}
.dueCard .dhd span{font-size:13px;color:var(--muted)}
.dueCard .dhd strong{margin-inline-start:auto;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.drow{padding:10px 14px;border-top:1px solid var(--line)}
.drow .r1{display:flex;gap:8px;font-weight:700}.drow .r1 b{margin-inline-start:auto}
.drow .r2{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.todo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.todo h3{margin:0;padding:10px 14px;font-family:var(--f-display);font-size:14px;background:var(--navy);color:var(--on-navy)}
.todo .ti{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.todo .ti span{flex:1;min-width:0}
.filters{display:grid;grid-template-columns:1fr auto;gap:8px}
.filters select{min-width:130px}
.todo .ti .tx{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px 6px;cursor:pointer;min-height:auto}
.editing .delcur{color:var(--danger,#b3261e)!important}
.todo .ti .btn{min-height:34px;padding:5px 12px;font-size:12.5px}
.todo .last{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
nav.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(16,24,40,.05);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tab{background:none;border:0;padding:9px 4px 10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--gold)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--on-navy);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgb(0 0 0 / .18)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on b{background:var(--ok)}.sync.err b{background:var(--danger)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--danger)}

/* ===== Quote sheet: exactly A4 ===== */
.paper{--k:1;width:210mm;height:297mm;overflow:hidden;background:#fff;color:#1b2430;font-family:"Cairo","IBM Plex Sans Arabic",Arial,sans-serif;padding:12mm 13mm 10mm;display:flex;flex-direction:column;position:relative}
.paper[dir="ltr"]{font-family:"Cairo",Arial,sans-serif}
.paper .frame{position:absolute;inset:6mm;border:1.5px solid #e8830f;pointer-events:none}
.paper .hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border-bottom:2px solid #e8830f;padding-bottom:12px}
.paper .hd .ttl{text-align:center}
.paper .hd .ttl .a{font-size:32px;font-weight:800;color:#0b4a9e;line-height:1.2}
.paper .hd .ttl .b{font-size:19px;font-weight:800;color:#e8830f;line-height:1.3;font-family:Arial,sans-serif}
.paper .hd .ttl .c{font-size:11.5px;color:#5d6773;font-family:Arial,sans-serif}
.paper .hd .lg{justify-self:end}
.paper[dir="ltr"] .hd{direction:rtl}
.paper[dir="ltr"] .hd .ttl{direction:ltr}
.paper .hd .lg img{width:170px;height:110px;object-fit:contain;display:block}
.paper .main{font-size:calc(14px * var(--k));display:flex;flex-direction:column}
.paper .meta{display:flex;justify-content:space-between;gap:20px;padding:1.1em .3em .4em;font-size:1.07em}
.paper .meta b{color:#0b4a9e;margin-inline-start:6px}
.paper .greet{color:#3a4552;padding:.3em .3em .9em}
.paper table{width:100%;border-collapse:collapse}
.crow .cnm{font-weight:700;color:var(--navy,#0b4a9e);font-size:13.5px}
.paper th{background:#e8f0fb;color:#0b4a9e;font-weight:700;padding:.6em .55em;border-bottom:1.5px solid #e8830f;text-align:center}
.paper td{padding:.55em;border-bottom:1px solid #e6e1d6;text-align:center;font-variant-numeric:tabular-nums}
.paper td.d,.paper th.d{text-align:start;padding-inline:.9em}
.paper td.num{direction:ltr}
.paper tr.blank td{height:2.55em}
.paper .vatrows{margin-top:2px;font-size:1em}
.paper .vatrows div{display:flex;justify-content:space-between;padding:.4em 1.1em;border-bottom:1px solid #e6e1d6}
.paper .vatrows .v{font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.paper .tot{display:flex;align-items:center;justify-content:space-between;background:#e8f0fb;border-top:2px solid #e8830f;padding:.85em 1.1em;margin-top:2px}
.paper .tot .l{font-weight:800;font-size:1.2em;color:#0b4a9e}
.paper .tot .v{font-weight:800;font-size:1.4em;color:#1b2430;direction:ltr;display:inline-flex;align-items:baseline;gap:8px}
.paper .tot .v small{font-size:.65em;color:#5d6773;font-weight:600}
.paper .nt{padding:1.1em .3em 0;font-size:.96em;color:#2c3540}
.paper .nt h4{margin:0 0 .4em;color:#e8830f;font-size:1.04em}
.paper .nt p{margin:0 0 .5em;line-height:1.65}
.paper .ft{margin-top:auto;border-top:1.5px solid #e8830f;padding-top:12px;display:flex;justify-content:space-between;gap:20px;font-size:13.5px}
.paper .ft .c1 div{font-weight:700}
.paper .ft .c1 .lab{font-family:Arial,sans-serif;font-weight:700;color:#0b4a9e;margin-bottom:4px}
.paper .ft .c1 .ph{direction:ltr;font-family:Arial,sans-serif}
.paper[dir="rtl"] .ft .c1 .ph{text-align:right}
.paper .ft .c1 .ph{display:flex;align-items:center;gap:5px;margin-top:3px}
.paper[dir="rtl"] .ft .c1 .ph{justify-content:flex-end}
.paper .ft .c1 .ic{width:17px;height:17px;display:block}
.paper .ft .c1 a{color:#1f5fbf;text-decoration:none;font-weight:600}
.paper .ft .c2{text-align:end}
.paper .ft .c2 .s{color:#5d6773}
.paper .ft .c2 .bn{font-weight:800;color:#0b4a9e;font-family:Arial,sans-serif}

#sheetHost{position:fixed;top:0;left:-12000px;width:210mm}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  body>*:not(#sheetHost){display:none!important}
  #sheetHost{position:static;left:auto;width:auto}
  .paper{height:296.5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img id="hdLogo" alt="HiTech">
    <div><h1 id="pageTitle"></h1><p>HiTech · IT Solutions</p></div>
    <div class="langsw" role="group" aria-label="Language">
      <button type="button" data-ui="ar">ع</button><button type="button" data-ui="en">EN</button>
    </div>
    <button type="button" class="gear" id="btnGear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>

  <!-- EDITOR -->
  <section class="view" id="v-edit">
    <div id="todo" class="todo" hidden></div>
    <div class="editing" id="editingBar" hidden><span id="editingTxt"></span><button id="btnNew2" type="button" data-t="startNew"></button><button id="btnDelCur" type="button" class="delcur" data-t="del"></button></div>
    <div class="card">
      <h2 data-t="quoteInfo"></h2>
      <div class="grid2">
        <label class="f"><span data-t="client"></span><input id="fClient" autocomplete="off"></label>
        <label class="f"><span data-t="date"></span><input id="fDate" type="date"></label>
        <label class="f" hidden><span data-t="currency"></span><input id="fCur" autocomplete="off"></label>
        <label class="f" hidden><span data-t="fbName"></span><input id="fFb" autocomplete="off"></label>
      </div>
      <div style="margin-top:12px">
        <div class="f" style="font-size:12.5px;color:var(--muted);margin-bottom:4px" data-t="docType"></div>
        <div class="seg" role="group" style="grid-template-columns:1fr 1fr 1fr"><button type="button" data-dt="quote" data-t="tQuote"></button><button type="button" data-dt="purchase" data-t="tPurchase"></button><button type="button" data-dt="invoice" data-t="tInvoice"></button></div>
      </div>
      <div id="linkBox" hidden style="margin-top:12px">
        <label class="f"><span data-t="linkLabel"></span><select id="fLink"></select></label>
        <p class="hint" style="margin-top:4px" data-t="linkHint"></p>
      </div>
      <p class="hint" id="noLine" style="margin-top:10px"></p>
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px">
        <span style="font-size:13.5px;font-weight:600" data-t="vatLabel"></span>
        <button type="button" class="sw" data-sw="vat" role="switch" aria-checked="false"><span data-swtxt></span><i></i></button>
      </div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px">
        <span style="font-size:13.5px;font-weight:600" data-t="sigLabel"></span>
        <button type="button" class="sw" data-sw="sig" role="switch" aria-checked="false"><span data-swtxt></span><i></i></button>
      </div>
      <div style="margin-top:12px">
        <div class="f" style="font-size:12.5px;color:var(--muted);margin-bottom:4px" data-t="quoteLang"></div>
        <div class="seg" role="group"><button type="button" data-ql="ar">العربية</button><button type="button" data-ql="en">English</button></div>
      </div>
    </div>

    <div class="card">
      <h2><span data-t="items"></span><small data-t="autoTotal"></small></h2>
      <div class="items" id="items"></div>
      <button class="btn add block" id="btnAdd" type="button" style="margin-top:10px" data-t="addItem"></button>
    </div>

    <div class="card">
      <h2 style="margin:0"><button type="button" id="notesToggle" class="ntog" aria-expanded="false"><span class="chev">▸</span><span data-t="notes"></span></button><button type="button" class="sw" id="swNotes" role="switch" aria-checked="true"><span id="swNotesTxt"></span><i></i></button></h2>
      <div id="notesBody" hidden style="margin-top:10px">
        <div class="notes" id="notes"></div>
        <button class="btn add block" id="btnAddNote" type="button" style="margin-top:10px" data-t="addNote"></button>
      </div>
    </div>

    <div class="card">
      <div class="totalbar">
        <div class="t"><span data-t="total"></span><strong id="sumTotal">0.00</strong><span id="sumVat" hidden style="font-size:12.5px;color:var(--muted)"></span><span id="sumProfit" hidden style="font-size:13px;color:var(--ink)"></span><span id="sumPaid" hidden style="font-size:13px"></span></div>
        <div class="acts">
          <button class="btn ghost" id="btnPreview" type="button" data-t="preview"></button>
          <button class="btn gold" id="btnSave" type="button" data-t="save"></button>
        </div>
      </div>
      <div class="warn" id="warn" hidden></div>
      <button class="btn ghost block" id="btnNew" type="button" style="margin-top:10px" data-t="newQuote"></button>
    </div>
  </section>

  <!-- PREVIEW -->
  <section class="view" id="v-prev" hidden>
    <div class="exp">
      <button class="btn pact" id="btnShare" type="button" data-t="sendPdf"></button>
      <button class="btn pact" id="btnPrint" type="button" data-t="print"></button>
      <button class="btn pact" id="btnPng" type="button" data-t="sendImg"></button>
      <button class="btn pact" id="btnCopy" type="button" data-t="copyText"></button>
    </div>
    <div class="seg" role="group" style="grid-template-columns:1fr 1fr 1fr"><button type="button" data-dt="quote" data-t="tQuote"></button><button type="button" data-dt="purchase" data-t="tPurchase"></button><button type="button" data-dt="invoice" data-t="tInvoice"></button></div>
    <div class="seg" role="group" aria-label="Language"><button type="button" data-ql="ar">العربية</button><button type="button" data-ql="en">In English</button></div>
    <div class="card" style="padding:10px 14px;display:flex;align-items:center;gap:10px"><span style="font-size:13.5px;font-weight:600" data-t="sigLabel"></span><button type="button" class="sw" data-sw="sig" role="switch" aria-checked="false"><span data-swtxt></span><i></i></button></div>
    <div class="editing" id="driveBox" hidden><span data-t="driveSaved"></span><a id="driveLink" href="#" target="_blank" rel="noopener" style="color:var(--navy);font-weight:700" data-t="openDrive"></a></div>
    <button class="btn ghost block" id="btnBack" type="button" data-t="back"></button>
    <p class="hint" data-t="prevHint"></p>
    <div class="pvwrap" id="pvwrap"><div class="pvscale" id="pvscale"></div></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-set" hidden>
    <div class="card" id="sbCard" hidden>
      <h2><span data-t="cloudTitle"></span><small class="sync" id="sbState"><b></b><span></span></small></h2>
      <p class="hint" style="margin-bottom:10px"><span data-t="cloudHint"></span> <b id="sbUser" dir="ltr"></b></p>
      <div class="exp">
        <button class="btn ghost" id="btnSbSync" type="button" data-t="syncNow"></button>
        <button class="btn ghost" id="btnLogout" type="button" data-t="logout"></button>
      </div>
    </div>
    <div class="card" id="sheetCard">
      <h2><span data-t="sheetTitle"></span><small class="sync" id="syncState"><b></b><span></span></small></h2>
      <p class="hint" style="margin-bottom:10px" data-t="sheetHint"></p>
      <label class="f"><span data-t="sheetUrl"></span><input id="fSheet" dir="ltr" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec"></label>
      <div class="exp" style="margin-top:10px">
        <button class="btn navy" id="btnSheetSave" type="button" data-t="sheetConnect"></button>
        <button class="btn ghost" id="btnSync" type="button" data-t="syncNow"></button>
      </div>
    </div>
    <div class="card">
      <h2 data-t="excelTitle"></h2>
      <p class="hint" style="margin-bottom:10px" data-t="excelHint"></p>
      <button class="btn gold block" id="btnExcel" type="button" data-t="excelBtn"></button>
    </div>
    <div class="card">
      <h2><span data-t="sigTitle"></span><small data-t="sigSmall"></small></h2>
      <div class="sigprev" id="sigPrev"><img id="sigImg" alt=""></div>
      <div id="sigEdit" hidden style="margin-top:10px">
        <p class="hint" style="margin-bottom:8px" data-t="sigHint"></p>
        <canvas class="sigpad" id="sigPad"></canvas>
        <div class="exp" style="margin-top:8px">
          <button class="btn gold" id="btnSigSave" type="button" data-t="sigSave"></button>
          <button class="btn ghost" id="btnSigCancel" type="button" data-t="cancel"></button>
        </div>
      </div>
      <div class="exp" style="margin-top:10px" id="sigActs">
        <button class="btn ghost" id="btnSigDraw" type="button" data-t="sigDraw"></button>
        <button class="btn ghost" id="btnSigUpload" type="button" data-t="sigUpload"></button>
        <button class="btn ghost" id="btnSigReset" type="button" data-t="sigReset" style="grid-column:1/-1"></button>
      </div>
      <input type="file" id="fSig" accept="image/*" hidden>
    </div>
  </section>

  <!-- PROFIT -->
  <section class="view" id="v-profit" hidden>
    <div class="ptot" id="pTot"></div>
    <div class="list" id="pMonths"></div>
  </section>

  <!-- ARCHIVE -->
  <section class="view" id="v-arch" hidden>
    <div class="seg" role="group" id="archMode" style="grid-template-columns:1fr 1fr;margin-bottom:10px"><button type="button" data-am="client" data-t="byClient"></button><button type="button" data-am="month" data-t="byMonth"></button></div>
    <div class="filters"><input id="fSearch" type="search" autocomplete="off"><select id="fMonth"></select></div>
    <div class="list" id="list"></div>
  </section>
</div>

<div id="login" hidden>
  <form class="lbox" id="loginForm">
    <img id="lgLogo" alt="HiTech">
    <h2 data-t="loginTitle"></h2>
    <label class="f"><span data-t="email"></span><input id="lgEmail" type="email" dir="ltr" autocomplete="username" required></label>
    <label class="f"><span data-t="password"></span><input id="lgPass" type="password" dir="ltr" autocomplete="current-password" required></label>
    <button class="btn gold block" type="submit" id="lgBtn" data-t="loginBtn"></button>
    <p class="warn" id="lgErr" hidden></p>
  </form>
</div>
<div id="sheetHost" aria-hidden="true"></div>
<datalist id="catalogList"></datalist>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-v="edit" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span data-t="tabEdit"></span></button>
  <button class="tab" role="tab" data-v="prev" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg><span data-t="tabPrev"></span></button>
  <button class="tab" role="tab" data-v="arch" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v13H3z"/><path d="M3 7l2-3h14l2 3M9 12h6"/></svg><span data-t="tabArch"></span></button>
  <button class="tab" role="tab" data-v="profit" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M6 15l4-5 3 3 5-7"/><path d="M15 6h3v3"/></svg><span data-t="tabProfit"></span></button>
</nav>
<div class="toast" id="toast" hidden></div>

const docTitle=q=>TITLES[q.lang==="en"?"en":"ar"][TITLES.ar[q.type]?q.type:"quote"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dmy=s=>{if(!s)return"";const[y,m,d]=s.split("-");return `${d}/${m}/${y}`};
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[,٬]/g,"").replace("٫","."));return isNaN(n)?null:n};
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return v===undefined?null:false}}

let ui=ls("htq-ui")||"ar";
const t=(k,...a)=>{const v=UI[ui][k];return typeof v==="function"?v(...a):v};

/* ---------- state ---------- */
function blank(lang,notes){lang=lang||"ar";return{id:null,type:"quote",showNotes:false,sign:false,vat:false,lang,client:"",date:today(),currency:CUR[lang],fb:"HiTech",items:[{d:"",q:"",p:""},{d:"",q:"",p:""},{d:"",q:"",p:""}],notes:(notes&&notes.length?notes:NOTES[lang]).slice()}}
let cur=ls("htq-draft")||blank(ui);
if(!cur.lang)cur.lang="ar";
const vis=a=>(a||[]).filter(x=>!x.deleted);
let saved=[]; let filter=""; let pendingDelete=null;

function rowState(it){
  const any=(it.d||"").trim()||it.q!==""||it.p!=="";
  if(!any)return{empty:true};
  const q=num(it.q),p=num(it.p);
  if(!(it.d||"").trim())return{msg:"needDesc"};
  if(q==null||p==null)return{msg:"needQP"};
  if(q<=0||p<0)return{msg:"checkQP"};
  return{ok:true,q,p,t:Math.round(q*p*100)/100};
}
const VAT_RATE=0.14;
function vatOf(sub,on){const v=on?Math.round(sub*VAT_RATE*100)/100:0;return{sub,vat:v,total:Math.round((sub+v)*100)/100}}
function calc(){let total=0,bad=0,count=0;cur.items.forEach(it=>{const s=rowState(it);if(s.ok){total+=s.t;count++}else if(s.msg)bad++});const sub=Math.round(total*100)/100;const V=vatOf(sub,cur.vat===true);return{sub,vat:V.vat,total:V.total,bad,count}}
function persist(){ls("htq-draft",cur)}

function applyUI(){
  document.documentElement.lang=ui;document.documentElement.dir=ui==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.querySelectorAll("[data-ui]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.ui===ui)));
  $("#fSearch").placeholder=t("search");$("#fClient").placeholder=t("clientPh");

/* Fit the content inside one A4 page: shrink text if it overflows, fill spare room with empty table rows */
function fitPaper(el){
  const main=el.querySelector(".main"),ft=el.querySelector(".ft"),tb=el.querySelector("tbody");
  const room=()=>ft.offsetTop-(main.offsetTop+main.offsetHeight)-14;
  let k=1;el.style.setProperty("--k",k);
  while(room()<0&&k>0.55){k=Math.round((k-0.04)*100)/100;el.style.setProperty("--k",k)}
  const tr=document.createElement("tr");tr.className="blank";tr.innerHTML="<td></td><td></td><td></td><td></td><td></td>";
  tb.appendChild(tr);const h=tr.offsetHeight;tr.remove();
  const real=tb.rows.length;let n=Math.floor(room()/h);n=Math.max(0,Math.min(n,15-real));
  for(let i=0;i<n;i++)tb.appendChild(tr.cloneNode(true));
}

    if(cur.linkWas&&cur.linkWas!==cur.fromPurchase){unl=all.find(x=>x.id===cur.linkWas&&x.type==="purchase"&&x.linkTo===body.id);if(unl){unl.linkTo="";unl.savedAt=now}}

function sizePad(){const r=pad.getBoundingClientRect();if(!r.width)return;const d=window.devicePixelRatio||1;pad.width=r.width*d;pad.height=r.height*d;pctx=pad.getContext("2d");pctx.scale(d,d);pctx.lineWidth=2.6;pctx.lineCap="round";pctx.lineJoin="round";pctx.strokeStyle="#1b2a4a";inked=false}
function ptr(e){const r=pad.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
pad.addEventListener("pointerdown",e=>{if(!pctx)sizePad();drawing=true;last=ptr(e);pad.setPointerCapture(e.pointerId);pctx.beginPath();pctx.arc(last.x,last.y,1.2,0,7);pctx.fillStyle=pctx.strokeStyle;pctx.fill();inked=true});
pad.addEventListener("pointermove",e=>{if(!drawing)return;const p=ptr(e);pctx.beginPath();pctx.moveTo(last.x,last.y);pctx.lineTo(p.x,p.y);pctx.stroke();last=p;inked=true});

/* crop to the ink and drop the white background, so the signature sits cleanly on the paper */
function cleanSig(src){const w=src.width,h=src.height,c=src.getContext("2d"),d=c.getImageData(0,0,w,h),a=d.data;let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const lum=(a[i]+a[i+1]+a[i+2])/3;
    if(a[i+3]<10||lum>200){a[i+3]=0}else{a[i+3]=Math.min(255,a[i+3]*(1-Math.max(0,lum-120)/80));if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0)return null;c.putImageData(d,0,0);const pd=6;x0=Math.max(0,x0-pd);y0=Math.max(0,y0-pd);x1=Math.min(w-1,x1+pd);y1=Math.min(h-1,y1+pd);
  const sc=Math.min(1,600/(x1-x0+1)),o=document.createElement("canvas");o.width=Math.round((x1-x0+1)*sc);o.height=Math.round((y1-y0+1)*sc);
  o.getContext("2d").drawImage(src,x0,y0,x1-x0+1,y1-y0+1,0,0,o.width,o.height);return o.toDataURL("image/png")}

$("#fSig").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const img=new Image();const u=URL.createObjectURL(f);
  img.onload=()=>{const sc=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);

const CFG=window.HT_CONFIG||{};

const IDLE_MS=5*60*1000;let lastAct=(()=>{try{return +localStorage.getItem("htq-act")||Date.now()}catch(e){return Date.now()}})();

  {if(!sb||!sbUser)throw new Error("auth");

    if(payload.action==="delete"){const {error}=await sb.from("documents").delete().eq("id",payload.id);if(error)throw error;return{ok:true}}
    const q=payload.quote;const row={id:q.id,type:q.type||"quote",client:q.client||"",doc_no:q.no||null,doc_date:q.date||null,total:+q.total||0,data:q,updated_at:q.savedAt||new Date().toISOString()};

async function sheetCall0(payload,get){
  if(!get&&payload&&payload.action==="save"&&payload.quote&&payload.quote.deleted&&!SB_ON)payload={action:"delete",id:payload.quote.id};
  if(IS_GAS){const j=get?await gasRun("apiList"):payload.action==="delete"?await gasRun("apiDelete",payload.id):await gasRun("apiSave",payload.quote);if(!j||!j.ok)throw new Error("bad");return j}

let syncing=false,syncAgain=false;
async function syncAll(announce){

async function syncAll0(announce){

  setSync("",t("syncing"));
  try{
    const j=await sheetCall(null,true);let all=ls("htq-saved")||[];let down=0,up=0;

  (ls("htq-saved")||saved).forEach(x=>{const m=re.exec(x.no||"");if(m)mx=Math.max(mx,+m[1])});return`${p}-${y}-${String(mx+1).padStart(3,"0")}`}

/* ---------- payments ---------- */
const paidOf=x=>(x.payments||[]).reduce((a,p)=>a+(+p.amt||0),0);
const dueOf=x=>(x.payments&&x.payments.length)?Math.max(0,Math.round(((+x.total||0)-paidOf(x))*100)/100):0;

/* ---------- item catalog: last buy / sell price per description ---------- */
function catalog(){const m=new Map();
  saved.slice().sort((a,b)=>(a.savedAt||"").localeCompare(b.savedAt||"")).forEach(x=>(x.items||[]).forEach(it=>{const k=normDesc(it.d);if(!k)return;const o=m.get(k)||{d:it.d.trim()};const p=num(it.p);
    if(p!=null){if(x.type==="purchase")o.buy=p;else if(x.type==="invoice")o.sell=p;else if(o.sell==null||x.type==="quote")o.quote=p}o.d=it.d.trim();m.set(k,o)}));return m}
function fillCatalogList(){const dl=$("#catalogList");if(!dl)return;dl.innerHTML=[...catalog().values()].map(o=>`<option value="${esc(o.d)}"></option>`).join("")}

/* ---------- profit ---------- */
/* purchase prices that belong to the sales invoice being edited: desc -> unit cost */
function buyMap(){if(cur.type!=="invoice")return null;const nm=normName(cur.client);
  const ps=saved.filter(p=>p.type==="purchase"&&((cur.id&&p.linkTo===cur.id)||p.id===cur.fromPurchase));
  if(!ps.length)return null;const m=new Map(),q=new Map();
  ps.forEach(p=>(p.items||[]).forEach(it=>{const k=normDesc(it.d),qq=num(it.q)||0,pr=num(it.p)||0;m.set(k,(m.get(k)||0)+qq*pr);q.set(k,(q.get(k)||0)+qq)}));
  const r=new Map();m.forEach((v,k)=>r.set(k,q.get(k)?v/q.get(k):0));return r}
const normName=n=>String(n||"").trim().toLowerCase().replace(/\s+/g," ");
const normDesc=n=>String(n||"").trim().toLowerCase().replace(/\s+/g," ");
const net=x=>+(x.sub!=null?x.sub:x.total)||0;
function computeProfit(){
  const sales=saved.filter(x=>x.type==="invoice"),buys=saved.filter(x=>x.type==="purchase");
  const deals=new Map(sales.map(s=>[s.id,{s,buys:[]}]));const orphans=[];
  buys.forEach(p=>{const id=p.linkTo&&deals.has(p.linkTo)?p.linkTo:"";if(id)deals.get(id).buys.push(p);else orphans.push(p)});
  const months=new Map();const mk=k=>{if(!months.has(k))months.set(k,{key:k,sales:0,cost:0,deals:[],orphans:[],waiting:[]});return months.get(k)};
  let S=0,C=0;
  deals.forEach(d=>{d.cost=d.buys.reduce((a,p)=>a+net(p),0);d.sale=net(d.s);d.profit=d.sale-d.cost;const m=mk((d.s.date||"").slice(0,7));if(!d.buys.length){m.waiting.push(d);return}m.sales+=d.sale;m.cost+=d.cost;m.deals.push(d);S+=d.sale;C+=d.cost});
  orphans.forEach(p=>{mk((p.date||"").slice(0,7)).orphans.push(p)});
  const list=[...months.values()].sort((a,b)=>b.key.localeCompare(a.key));
  list.forEach(m=>{m.profit=m.sales-m.cost;m.deals.sort((a,b)=>(b.s.date||"").localeCompare(a.s.date||""))});
  return{sales:S,cost:C,profit:S-C,months:list};
}
function monthName(k){const[y,m]=k.split("-").map(Number);if(!y||!m)return k;return new Date(y,m-1,1).toLocaleDateString(ui==="ar"?"ar-EG-u-nu-latn":"en-GB",{month:"long",year:"numeric"})}
const sgn=v=>v<0?"neg":"pos";
function updateChip(){}
function itemCompare(d){
  const buy=new Map();d.buys.forEach(p=>(p.items||[]).forEach(it=>{const k=normDesc(it.d);const q=num(it.q)||0,pr=num(it.p)||0;const o=buy.get(k)||{q:0,v:0,d:it.d};o.q+=q;o.v+=q*pr;buy.set(k,o)}));
  const used=new Set();
  const rows=(d.s.items||[]).map(it=>{const k=normDesc(it.d);const q=num(it.q)||0,sp=num(it.p)||0;const b=buy.get(k);used.add(k);
    const bp=b&&b.q?b.v/b.q:null;return{d:it.d,q,sp,bp,g:bp==null?null:(sp-bp)*q}});
  buy.forEach((b,k)=>{if(!used.has(k))rows.push({d:b.d,q:b.q,sp:null,bp:b.q?b.v/b.q:0,g:-b.v})});
  return`<div class="cmp"><table><thead><tr><th>${t("colItem")}</th><th>${t("qty")}</th><th>${t("colBuy")}</th><th>${t("colSell")}</th><th>${t("colGain")}</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="d">${esc(r.d)}</td><td>${r.q}</td><td>${r.bp==null?"—":fmt(r.bp)}</td><td>${r.sp==null?"—":fmt(r.sp)}</td><td class="${r.g==null?"":sgn(r.g)}">${r.g==null?"—":fmt(r.g)}</td></tr>`).join("")}</tbody></table></div>`;
}
let openDeal=null;
function dueBlock(){const inv=saved.filter(x=>x.type==="invoice"&&dueOf(x)>0);const tot=inv.reduce((a,x)=>a+dueOf(x),0);
  const by=new Map();inv.forEach(x=>{const k=normName(x.client);if(!by.has(k))by.set(k,{name:x.client,due:0,list:[]});const o=by.get(k);o.due+=dueOf(x);o.list.push(x)});
  const rows=[...by.values()].sort((a,b)=>b.due-a.due).map(o=>`<div class="drow"><div class="r1"><span class="nm">${esc(o.name)}</span><b class="neg">${fmt(o.due)}</b></div>${o.list.map(x=>`<div class="r2"><span dir="ltr">${esc(x.no||"")}</span><span>${esc(dmy(x.date))}</span><span>${t("colSell")} ${fmt(x.total)}</span><span>${t("paidL")} ${fmt(paidOf(x))}</span><span class="neg">${t("dueL")} ${fmt(dueOf(x))}</span></div>`).join("")}</div>`).join("");
  return`<div class="dueCard"><div class="dhd"><span>${t("outstanding")}</span><strong class="${tot>0?"neg":""}">${fmt(tot)}</strong></div>${tot>0?rows:`<p class="hint" style="padding:0 14px 12px">${t("noDue")}</p>`}</div>`}
function renderProfit(){
  const P=computeProfit();updateChip();
  const thisM=P.months.find(m=>m.key===today().slice(0,7));
  $("#pTot").innerHTML=`<div class="big"><span>${t("profitTotal")}</span><strong class="${P.profit<0?"neg":""}">${fmt(P.profit)}</strong></div>
   <div class="sm"><span>${t("salesTotal")}</span><strong>${fmt(P.sales)}</strong></div><div class="sm"><span>${t("costTotal")}</span><strong>${fmt(P.cost)}</strong></div>
   <div class="sm"><span>${t("thisMonth")}</span><strong class="${sgn(thisM?thisM.profit:0)}">${fmt(thisM?thisM.profit:0)}</strong></div>
   ${dueBlock()}`;
  if(!P.months.length){$("#pMonths").innerHTML=`<div class="empty"><strong>${t("profitEmpty")}</strong>${t("profitEmptyB")}</div>`;return}
  $("#pMonths").innerHTML=P.months.map(m=>`<div class="month"><h3>${esc(monthName(m.key))}<small>${t("invoicesN",m.deals.length)}</small><b class="${sgn(m.profit)}">${fmt(m.profit)}</b></h3>
    <div class="msum"><div>${t("monthSales")}<b>${fmt(m.sales)}</b></div><div>${t("monthCost")}<b>${fmt(m.cost)}</b></div><div>${t("margin")}<b>${m.sales?Math.round(m.profit/m.sales*100):0}%</b></div></div>
    ${m.deals.map(d=>`<div class="inv" data-deal="${esc(d.s.id)}" role="button" tabindex="0"><div class="r1"><span class="nm">${esc(d.s.client)}</span><b class="${sgn(d.profit)}">${fmt(d.profit)}</b></div>
      <div class="r2"><span>${esc(dmy(d.s.date))}</span><span>${t("colSell")} ${fmt(d.sale)}</span><span>${t("colBuy")} ${fmt(d.cost)}</span></div>
      ${openDeal===d.s.id?itemCompare(d):""}</div>`).join("")}
    ${m.waiting.map(d=>`<div class="inv" data-wait="${esc(d.s.id)}" role="button" tabindex="0"><div class="r1"><span class="nm">${esc(d.s.client)}</span><b style="color:var(--muted)">${t("colSell")} ${fmt(d.sale)}</b></div><div class="r2"><span>${esc(dmy(d.s.date))}</span><span class="alert">⚠ ${t("waitBuy")}</span><span class="act">${t("addPurchase")}</span></div></div>`).join("")}
    ${m.orphans.map(p=>`<div class="inv" data-pend="${esc(p.id)}" role="button" tabindex="0"><div class="r1"><span class="nm">${esc(p.client)}</span><b style="color:var(--muted)">${t("colBuy")} ${fmt(p.total)}</b></div><div class="r2"><span>${esc(dmy(p.date))}</span><span class="alert">⚠ ${t("pendingSale")}</span><span class="act">${t("addSale")}</span></div></div>`).join("")}
  </div>`).join("");
}
$("#pMonths").addEventListener("click",e=>{const wt=e.target.closest("[data-wait]");if(wt){const x=saved.find(s=>s.id===wt.dataset.wait);if(x){show("arch");filter="";$("#fSearch").value="";openClients.add(normName(x.client));runAct("buy",x.id)}return}const pe=e.target.closest("[data-pend]");if(pe){const x=saved.find(s=>s.id===pe.dataset.pend);if(x){show("arch");filter="";$("#fSearch").value="";openClients.add(normName(x.client));runAct("sell",x.id)}return}const el=e.target.closest("[data-deal]");if(!el)return;openDeal=openDeal===el.dataset.deal?null:el.dataset.deal;renderProfit()});

/* ---------- "waiting on you" panel on the Add tab ---------- */
let lastSavedNote="";
function renderTodo(){const el=$("#todo");if(!el)return;let P;try{P=computeProfit()}catch(e){return}
  const items=[];
  let dis=[];try{dis=JSON.parse(localStorage.getItem("htq-dismiss")||"[]")}catch(e){}
  P.months.forEach(m=>{m.orphans.forEach(p=>items.push({k:"b:"+p.id,d:p.savedAt,h:`<span>⚠ ${esc(t("todoBuy",p.client,dmy(p.date)))}</span>${docBtn("gold","sell",p.id,t("makeSale"))}`}));
    m.waiting.forEach(w=>items.push({k:"s:"+w.s.id,d:w.s.savedAt,h:`<span>⚠ ${esc(t("todoSale",w.s.client,dmy(w.s.date)))}</span>${docBtn("ghost buyb","buy",w.s.id,t("makeBuy"))}`}))});
  saved.filter(x=>x.type==="invoice"&&dueOf(x)>0).forEach(x=>items.push({k:"d:"+x.id+":"+dueOf(x),d:x.savedAt,h:`<span class="neg">● ${esc(t("todoDue",x.client,fmt(dueOf(x))))}</span>${docBtn("ghost","pay",x.id,t("payBtn"))}`}));
  for(let i=items.length-1;i>=0;i--)if(dis.includes(items[i].k))items.splice(i,1);
  items.sort((a,b)=>(b.d||"").localeCompare(a.d||""));
  const last=lastSavedNote?`<div class="ti last">✓ ${esc(lastSavedNote)}</div>`:"";
  if(!items.length&&!last){el.hidden=true;return}
  el.hidden=false;el.innerHTML=`${items.length?`<h3>${t("todoTitle")} (${items.length})</h3>`:""}${items.slice(0,5).map(i=>`<div class="ti">${i.h}<button class="tx" type="button" data-dismiss="${esc(i.k)}" aria-label="${esc(t("dismiss"))}" title="${esc(t("dismiss"))}">✕</button></div>`).join("")}${last}`}

/* ---------- tabs / toast ---------- */
let curView="edit";
const VIEW_T={edit:"tabEdit",prev:"tabPrev",arch:"tabArch",profit:"tabProfit",set:"tabSet"};
function setTitle(){$("#pageTitle").textContent=t(VIEW_T[curView]||"tabEdit")}
function show(v){if(v==="edit"&&cur._reset)resetAdd();curView=v;["edit","prev","arch","profit","set"].forEach(k=>{$("#v-"+k).hidden=k!==v});
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===v)));
  $("#btnGear").setAttribute("aria-pressed",String(v==="set"));setTitle();
  window.scrollTo(0,0);if(v==="prev")renderPreview();if(v==="set")renderSig();if(v==="profit")renderProfit();if(v==="arch")renderList();if(v==="edit")renderTodo()}
function resetAdd(){const ty=cur.type,lang=cur.lang,sg=cur.sign,nm=cur.client;
  const last=saved.find(q=>(q.lang||"ar")===lang&&q.type!=="purchase"&&(q.notes||[]).length);cur=blank(lang,last&&last.notes);cur.type=ty;cur.sign=sg===true;
  lastSavedNote=`${t("lastSaved")}: ${t(ty==="invoice"?"saleRow":ty==="purchase"?"buyRow":"quoteRow")} · ${nm}`;persist();renderEditor()}
$("#btnGear").onclick=()=>show(curView==="set"?"edit":"set");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>show(b.dataset.v));
document.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{archMode=b.dataset.am;try{localStorage.setItem("htq-archmode",archMode)}catch(e){}renderList()});
let tt;function toast(m){const el=$("#toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,/^⚠/.test(m)?9000:2600)}

addEventListener("error",e=>{try{toast("⚠ "+(UI[ui].errPre||"Error")+": "+String(e.message||e.error||"").slice(0,140))}catch(_){}});
addEventListener("unhandledrejection",e=>{const m=String(e.reason&&e.reason.message||e.reason||"");if(/timeout|fetch|network|auth/i.test(m))return;try{toast("⚠ "+(UI[ui].errPre||"Error")+": "+m.slice(0,140))}catch(_){}});
$("#hdLogo").src=LOGO;
if(IS_GAS){$("#fSheet").closest("label").hidden=true;$("#btnSheetSave").hidden=true;const h=document.querySelector('[data-t="sheetHint"]');h.dataset.t="gasHint"}
initStore();applyUI();if(cur._reset)resetAdd();
if(SB_ON){$("#sheetCard").hidden=true;$("#sbCard").hidden=false;setSync("",t("syncing"));sbInit().catch(e=>{console.error(e);setSync("err");toast(t("loginNet"))})}
else{$("#fSheet").value=IS_GAS?"":sheetUrl();setSync(sheetUrl()?"":"off",sheetUrl()?t("syncing"):undefined);if(sheetUrl())syncAll(false)}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
